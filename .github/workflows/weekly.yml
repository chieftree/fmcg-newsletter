name: Weekly FMCG Newsletter

on:
  schedule:
    # Every Monday 06:00 KST = Sunday 21:00 UTC
    - cron: "0 21 * * 0"
  workflow_dispatch:   # allow manual trigger from GitHub UI

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  send-newsletter:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Generate and send newsletter
        env:
          GEMINI_API_KEY:      ${{ secrets.GEMINI_API_KEY }}
          GMAIL_USER:          ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD:  ${{ secrets.GMAIL_APP_PASSWORD }}
          GITHUB_REPOSITORY:   ${{ github.repository }}
        run: python main.py

      - name: Commit generated newsletter and updated history
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/ config/sent_history.json
          if git diff --cached --quiet; then
            echo "Nothing to commit."
          else
            git commit -m "newsletter: $(date -u +'%Y-%m-%d') weekly issue"
            git push
          fi
