name: FMCG Newsletter

on:
  schedule:
    - cron: "0 21 * * 0"   # Monday   06:00 KST (Sunday   21:00 UTC)
    - cron: "0 21 * * 3"   # Thursday 06:00 KST (Wednesday 21:00 UTC)
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  send-newsletter:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Generate and send newsletter
        env:
          GEMINI_API_KEY:      ${{ secrets.GEMINI_API_KEY }}
          GMAIL_USER:          ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD:  ${{ secrets.GMAIL_APP_PASSWORD }}
          YOUTUBE_API_KEY:     ${{ secrets.YOUTUBE_API_KEY }}
          GITHUB_REPOSITORY:   ${{ github.repository }}
        run: python main.py

      - name: Commit newsletter and updated history
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/ config/sent_history.json
          if git diff --cached --quiet; then
            echo "Nothing to commit."
          else
            git commit -m "newsletter: $(date -u +'%Y-%m-%d') issue"
            git push
          fi
